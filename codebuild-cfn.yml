AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CI/CD pipeline for test-automation-workspace.
  Provisions CodeBuild project connected to CodeCommit, with S3 artifact storage
  and a static website bucket for shareable HTML test reports.

Parameters:
  ProjectName:
    Type: String
    Default: test-automation-pipeline
    Description: Name for the CodeBuild project
  RepositoryName:
    Type: String
    Default: test-automation-workspace
    Description: CodeCommit repository name
  BranchName:
    Type: String
    Default: main
    Description: Branch to build from
  ComputeType:
    Type: String
    Default: BUILD_GENERAL1_MEDIUM
    AllowedValues:
      - BUILD_GENERAL1_SMALL
      - BUILD_GENERAL1_MEDIUM
      - BUILD_GENERAL1_LARGE
    Description: CodeBuild compute instance size
  BrowserStackUsernamePath:
    Type: String
    Default: /test-automation/browserstack/username
    Description: SSM Parameter Store path for BrowserStack username
  BrowserStackAccessKeyPath:
    Type: String
    Default: /test-automation/browserstack/access-key
    Description: SSM Parameter Store path for BrowserStack access key
  NightlySchedule:
    Type: String
    Default: cron(0 0 * * ? *)
    Description: Cron expression for the daily BrowserStack run (default 00:00 UTC every day)
  BrowserStackSuite:
    Type: String
    Default: chrome
    AllowedValues:
      - chrome
      - firefox
      - safari
      - all
    Description: Which BrowserStack platform config the scheduled run uses
  BuildTimeoutInMinutes:
    Type: Number
    Default: 60
    MinValue: 5
    MaxValue: 480
    Description: >
      CodeBuild timeout. A BrowserStack run pays for dependency install, the Local
      tunnel handshake and remote session queueing, so 30 minutes is often too tight.
  ProjectTag:
    Type: String
    Default: box-cc-jg-qa-2026
    Description: Cost allocation tag value for the Project key
  NotificationEmail:
    Type: String
    Default: ""
    Description: >
      Email address to notify when a build fails. Leave empty to skip creating the
      SNS topic and alarm. A scheduled run nobody watches is a run nobody trusts.

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-artifacts-${AWS::AccountId}"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ReportBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldReports
            Status: Enabled
            ExpirationInDays: 90
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  ReportBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReportBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadForReports
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${ReportBucket.Arn}/*"

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codebuild-role"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "${ProjectName}-codebuild-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}:*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
                  - !GetAtt ReportBucket.Arn
                  - !Sub "${ReportBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - codecommit:GitPull
                Resource:
                  - !Sub "arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:${RepositoryName}"
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${BrowserStackUsernamePath}"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${BrowserStackAccessKeyPath}"
              # Required when the BrowserStack access key is stored as a SecureString.
              # Without this the scheduled build starts but resolves empty credentials.
              # Scoped to SSM so the role cannot decrypt anything else in the account.
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
              - Effect: Allow
                Action:
                  - codebuild:CreateReport
                  - codebuild:UpdateReport
                  - codebuild:BatchPutTestCases
                  - codebuild:BatchPutCodeCoverages
                Resource:
                  - !Sub "arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/${ProjectName}-*"

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Ref ProjectName
      Description: "Playwright test execution pipeline for test-automation-accelerator"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
      ServiceRole: !GetAtt CodeBuildRole.Arn
      TimeoutInMinutes: !Ref BuildTimeoutInMinutes
      Source:
        Type: CODECOMMIT
        Location: !Sub "https://git-codecommit.${AWS::Region}.amazonaws.com/v1/repos/${RepositoryName}"
        BuildSpec: buildspec.yml
        GitCloneDepth: 1
      SourceVersion: !Sub "refs/heads/${BranchName}"
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: !Ref ComputeType
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: CI
            Value: "true"
          - Name: ENV
            Value: "dev"
          - Name: BASE_URL
            Value: "http://localhost:5173"
          - Name: API_BASE_URL
            Value: "http://localhost:3000"
          - Name: NODE_OPTIONS
            Value: "--max-old-space-size=4096"
          - Name: REPORT_BUCKET
            Value: !Ref ReportBucket
          - Name: NIGHTLY_BROWSERSTACK
            Value: "false"
          - Name: BROWSERSTACK_SUITE
            Value: !Ref BrowserStackSuite
          # buildName base; the buildspec appends the UTC date so each daily run
          # is a distinct build in the BrowserStack dashboard. Referenced as
          # ${BROWSERSTACK_BUILD_NAME} from config/browserstack/*.yml.
          - Name: BROWSERSTACK_BUILD_NAME
            Value: !Sub "${ProjectName}-daily"
          - Name: BROWSERSTACK_PROJECT_NAME
            Value: "Test Automation Accelerator"
          - Name: BROWSERSTACK_USERNAME
            Value: !Ref BrowserStackUsernamePath
            Type: PARAMETER_STORE
          - Name: BROWSERSTACK_ACCESS_KEY
            Value: !Ref BrowserStackAccessKeyPath
            Type: PARAMETER_STORE
      Artifacts:
        Type: S3
        Location: !Ref ArtifactBucket
        Packaging: ZIP
        NamespaceType: BUILD_ID
        OverrideArtifactName: true
      Cache:
        Type: S3
        Location: !Sub "${ArtifactBucket}/cache"
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub "/aws/codebuild/${ProjectName}"

  EventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-eventbridge-role"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "${ProjectName}-eventbridge-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource: !GetAtt CodeBuildProject.Arn

  NightlyBrowserStackRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-nightly-browserstack"
      Description: !Sub "Daily BrowserStack test run (${NightlySchedule}), suite: ${BrowserStackSuite}"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
      ScheduleExpression: !Ref NightlySchedule
      State: ENABLED
      Targets:
        - Arn: !GetAtt CodeBuildProject.Arn
          RoleArn: !GetAtt EventBridgeRole.Arn
          Id: TriggerNightlyBrowserStack
          Input: '{"environmentVariablesOverride": [{"name": "NIGHTLY_BROWSERSTACK", "value": "true", "type": "PLAINTEXT"}]}'

  CodeCommitPushRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-on-push"
      Description: "Trigger CodeBuild on push to main branch"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
      EventPattern:
        source:
          - aws.codecommit
        detail-type:
          - "CodeCommit Repository State Change"
        resources:
          - !Sub "arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:${RepositoryName}"
        detail:
          event:
            - referenceCreated
            - referenceUpdated
          referenceType:
            - branch
          referenceName:
            - !Ref BranchName
      Targets:
        - Arn: !GetAtt CodeBuildProject.Arn
          RoleArn: !GetAtt EventBridgeRole.Arn
          Id: TriggerCodeBuild

  # --- Build failure notifications -------------------------------------------
  # Without this, a failed daily BrowserStack run is only visible to someone who
  # goes looking in the console.
  BuildNotificationTopic:
    Type: AWS::SNS::Topic
    Condition: HasNotificationEmail
    Properties:
      TopicName: !Sub "${ProjectName}-build-failures"
      DisplayName: !Sub "${ProjectName} build failures"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
      Subscription:
        - Endpoint: !Ref NotificationEmail
          Protocol: email

  BuildNotificationTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: HasNotificationEmail
    Properties:
      Topics:
        - !Ref BuildNotificationTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref BuildNotificationTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId

  BuildFailureRule:
    Type: AWS::Events::Rule
    Condition: HasNotificationEmail
    Properties:
      Name: !Sub "${ProjectName}-build-failed"
      Description: "Notify when a build fails or is stopped"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
      EventPattern:
        source:
          - aws.codebuild
        detail-type:
          - "CodeBuild Build State Change"
        detail:
          project-name:
            - !Ref CodeBuildProject
          build-status:
            - FAILED
            - STOPPED
      Targets:
        - Arn: !Ref BuildNotificationTopic
          Id: NotifyOnBuildFailure
          InputTransformer:
            InputPathsMap:
              project: "$.detail.project-name"
              status: "$.detail.build-status"
              buildId: "$.detail.build-id"
            InputTemplate: >-
              "Build <status> for project <project>."
              "Build ID: <buildId>"
              "Logs and the Playwright report are linked from the CodeBuild console."

Outputs:
  CodeBuildProjectName:
    Value: !Ref CodeBuildProject
    Description: CodeBuild project name
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
    Description: S3 bucket for test artifacts
  ReportBucketName:
    Value: !Ref ReportBucket
    Description: S3 bucket for HTML test reports
  ReportURL:
    Value: !Sub "http://${ReportBucket}.s3-website-${AWS::Region}.amazonaws.com/latest/index.html"
    Description: URL to view the latest Playwright HTML report
  CodeBuildConsoleURL:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codebuild/projects/${ProjectName}/history?region=${AWS::Region}"
    Description: URL to view build history in AWS Console
  DailyScheduleExpression:
    Value: !Ref NightlySchedule
    Description: Cron expression driving the daily BrowserStack run (UTC)
  BuildNotificationTopicArn:
    Condition: HasNotificationEmail
    Value: !Ref BuildNotificationTopic
    Description: SNS topic notified on build failure (confirm the email subscription)
