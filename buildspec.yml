version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Installing qe-playground dependencies..."
      - cd $CODEBUILD_SRC_DIR/qe-playground/server && npm ci
      - cd $CODEBUILD_SRC_DIR/qe-playground/client && npm ci
      - echo "Installing test-accelerator dependencies..."
      - cd $CODEBUILD_SRC_DIR/test-accelerator && npm ci
      - npx playwright install --with-deps chromium

  build:
    on-failure: CONTINUE
    commands:
      - cd $CODEBUILD_SRC_DIR/test-accelerator
      - echo "Linting..."
      - npm run lint 2>&1 || LINT_EXIT_CODE=$?
      - |
        if [ "$NIGHTLY_BROWSERSTACK" = "true" ]; then
          echo "Running nightly BrowserStack Chrome tests..."
          BROWSERSTACK_BUILD_NAME="nightly-$(date +%Y-%m-%d)" npm run test:bs:chrome 2>&1 || TEST_EXIT_CODE=$?
        else
          echo "Running Playwright tests..."
          npx playwright test 2>&1 || TEST_EXIT_CODE=$?
        fi
      - echo "Tests completed with exit code ${TEST_EXIT_CODE:-0} (lint exit code ${LINT_EXIT_CODE:-0})"

  post_build:
    commands:
      - cd $CODEBUILD_SRC_DIR/test-accelerator
      - echo "Publishing HTML report to S3..."
      - BUILD_TIMESTAMP=$(date +%Y-%m-%d-%H%M%S)
      - aws s3 sync playwright-report/ s3://$REPORT_BUCKET/latest/ --delete
      - aws s3 sync playwright-report/ s3://$REPORT_BUCKET/runs/$BUILD_TIMESTAMP/
      - |
        REPORT_URL="http://$REPORT_BUCKET.s3-website-$AWS_REGION.amazonaws.com/latest/index.html"
        echo ""
        echo "============================================"
        echo "  PLAYWRIGHT REPORT URL"
        echo "  $REPORT_URL"
        echo "============================================"
        echo ""
      - |
        if [ "${LINT_EXIT_CODE:-0}" -ne 0 ] || [ "${TEST_EXIT_CODE:-0}" -ne 0 ]; then
          echo "Build failed (lint=${LINT_EXIT_CODE:-0}, tests=${TEST_EXIT_CODE:-0}). Check the report for details."
          exit 1
        else
          echo "All checks passed."
        fi

reports:
  playwright-results:
    files:
      - "test-results/results.json"
    base-directory: "test-accelerator"
    file-format: "GENERICJSONREPORT"

artifacts:
  files:
    - "test-accelerator/playwright-report/**/*"
    - "test-accelerator/test-results/**/*"
  base-directory: "."
  name: "test-results-$(date +%Y-%m-%d-%H%M%S)"
  discard-paths: no

cache:
  paths:
    - '/root/.npm/**/*'
    - '/root/.cache/ms-playwright/**/*'
