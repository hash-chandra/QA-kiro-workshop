version: 0.2

# Two execution modes, selected by the NIGHTLY_BROWSERSTACK env flag:
#   true  -> cross-browser run on BrowserStack (scheduled daily via EventBridge)
#   false -> local headless Playwright run (on every push to the tracked branch)
#
# Exit codes are written to files under STATUS_DIR rather than kept in shell
# variables. CodeBuild does not guarantee that a variable set in one phase is
# visible in a later phase, which meant the old post_build gate always read 0 and
# reported success even when the suite failed.

env:
  variables:
    STATUS_DIR: "/tmp/build-status"
    # Which BrowserStack platform config to use: chrome | firefox | safari | all
    BROWSERSTACK_SUITE: "chrome"

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - mkdir -p "$STATUS_DIR"
      # One workspace-aware install from the repo root.
      #
      # Installing each package separately does not work here. The root
      # package.json declares qe-playground/server, qe-playground/client and
      # test-accelerator as workspaces, so `npm ci` inside one member resolves the
      # workspace root and prunes its siblings' node_modules. Running the three in
      # sequence left the server without fastify, the Playwright webServer failed
      # to boot with ERR_MODULE_NOT_FOUND, and every UI test failed.
      #
      # `npm install` rather than `npm ci`, deliberately. The committed lockfile was
      # generated on macOS, so the only rolldown binding it records is
      # @rolldown/binding-darwin-arm64. Vite 8 needs the binding matching the host,
      # and `npm ci` installs strictly what the lockfile lists, so on Linux it
      # installs none and the dev server dies with MODULE_NOT_FOUND. `npm install`
      # re-resolves rolldown's optional platform dependencies for this machine.
      # Switch back to `npm ci` once the lockfile carries every platform binding.
      - echo "Installing workspace dependencies from the repo root..."
      - cd "$CODEBUILD_SRC_DIR" && npm install --no-audit --no-fund
      - cd "$CODEBUILD_SRC_DIR/test-accelerator" && npx playwright install --with-deps chromium
      # Verify both webServer processes can actually start. Without this the failure
      # surfaces much later as an opaque "webServer was not able to start".
      - |
        cd "$CODEBUILD_SRC_DIR/qe-playground/server"
        node -e "import('fastify').then(()=>console.log('ok: server resolves fastify')).catch(e=>{console.error('FAILED: server cannot resolve fastify:',e.code);process.exit(1)})"
      # Check by module resolution, not by path: with a root workspace install npm
      # hoists @rolldown/* to the root node_modules, so looking only inside
      # qe-playground/client gives a false negative.
      - |
        cd "$CODEBUILD_SRC_DIR/qe-playground/client"
        echo "rolldown bindings present in the tree:"
        find "$CODEBUILD_SRC_DIR" -type d -name 'binding-*' -path '*@rolldown*' 2>/dev/null | sed "s|$CODEBUILD_SRC_DIR|.|" | sed 's/^/  /'
        if node --input-type=module -e "import('rolldown')" 2>/dev/null; then
          echo "ok: client can load the rolldown native binding"
        else
          # Repair path for the macOS-generated lockfile. Pin to the resolved
          # rolldown version so the binding cannot drift from its host package.
          RD_VER=$(node -p "require('rolldown/package.json').version" 2>/dev/null || echo "")
          echo "rolldown failed to load; installing the linux x64 binding explicitly (rolldown=${RD_VER:-unknown})"
          if [ -n "$RD_VER" ]; then
            npm install --no-save --no-audit --no-fund "@rolldown/binding-linux-x64-gnu@$RD_VER" 2>&1 | tail -3
          else
            npm install --no-save --no-audit --no-fund @rolldown/binding-linux-x64-gnu 2>&1 | tail -3
          fi
          node --input-type=module -e "import('rolldown').then(()=>console.log('ok: rolldown loads after repair')).catch(e=>{console.error('FAILED: rolldown still unavailable:',e.message);process.exit(1)})"
        fi

  pre_build:
    commands:
      - |
        if [ "$NIGHTLY_BROWSERSTACK" = "true" ]; then
          echo "Mode: BrowserStack cross-browser run (suite: ${BROWSERSTACK_SUITE})"
        else
          echo "Mode: local headless Playwright run"
        fi
      # Fail fast with an actionable message instead of letting the BrowserStack
      # SDK start a run it cannot authenticate. Secret values are never echoed.
      - |
        if [ "$NIGHTLY_BROWSERSTACK" = "true" ]; then
          if [ -z "$BROWSERSTACK_USERNAME" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "ERROR: BrowserStack credentials resolved to empty values."
            echo "Check that the SSM parameters referenced by the CodeBuild project exist and"
            echo "that the build role allows ssm:GetParameters (plus kms:Decrypt for SecureString)."
            exit 1
          fi
          echo "BrowserStack credentials resolved for user: ${BROWSERSTACK_USERNAME}"
          case "$BROWSERSTACK_SUITE" in
            chrome|firefox|safari|all) ;;
            *) echo "ERROR: BROWSERSTACK_SUITE must be chrome, firefox, safari or all (got '$BROWSERSTACK_SUITE')."; exit 1 ;;
          esac
        fi

  build:
    on-failure: CONTINUE
    commands:
      - |
        cd "$CODEBUILD_SRC_DIR/test-accelerator"
        echo "Linting..."
        set +e
        npm run lint 2>&1
        LINT_EXIT=$?
        set -e
        echo "$LINT_EXIT" > "$STATUS_DIR/lint.exit"
        echo "Lint finished with exit code $LINT_EXIT"
      - |
        cd "$CODEBUILD_SRC_DIR/test-accelerator"
        set +e
        if [ "$NIGHTLY_BROWSERSTACK" = "true" ]; then
          # The BrowserStack SDK expands ${BROWSERSTACK_BUILD_NAME} inside
          # config/browserstack/*.yml, so exporting it is enough. The previous
          # `sed` rewrite of browserstack.chrome.yml only covered one browser and
          # would fail silently if that line ever moved.
          export BROWSERSTACK_BUILD_NAME="${BROWSERSTACK_BUILD_NAME:-accelerator}-$(date -u +%Y-%m-%d)"
          echo "Running BrowserStack suite '${BROWSERSTACK_SUITE}' as build '${BROWSERSTACK_BUILD_NAME}'..."
          if [ "$BROWSERSTACK_SUITE" = "all" ]; then
            npm run test:bs 2>&1
          else
            npm run "test:bs:${BROWSERSTACK_SUITE}" 2>&1
          fi
        else
          echo "Running local Playwright tests..."
          npx playwright test 2>&1
        fi
        TEST_EXIT=$?
        set -e
        echo "$TEST_EXIT" > "$STATUS_DIR/test.exit"
        echo "Tests finished with exit code $TEST_EXIT"

  post_build:
    commands:
      # A missing junit.xml means the run died before Playwright wrote results.
      # Emit a failing placeholder so the report group still parses and the
      # problem shows up as a failed test case rather than an opaque
      # "no report files found" error that hides the real cause.
      - |
        cd "$CODEBUILD_SRC_DIR/test-accelerator"
        mkdir -p test-results playwright-report
        if [ ! -f test-results/junit.xml ]; then
          echo "WARNING: test-results/junit.xml is missing — writing a failing placeholder."
          MSG="No JUnit results were produced. The run failed before or during startup; see the build log above."
          {
            printf '<?xml version="1.0" encoding="UTF-8"?>\n'
            printf '<testsuites tests="1" failures="1" errors="0" time="0">\n'
            printf '  <testsuite name="run-setup" tests="1" failures="1" errors="0" time="0">\n'
            printf '    <testcase name="Playwright produced test results" classname="run-setup" time="0">\n'
            printf '      <failure message="%s">%s</failure>\n' "$MSG" "$MSG"
            printf '    </testcase>\n'
            printf '  </testsuite>\n'
            printf '</testsuites>\n'
          } > test-results/junit.xml
        fi
      - |
        cd "$CODEBUILD_SRC_DIR/test-accelerator"
        if [ -z "$(ls -A playwright-report 2>/dev/null)" ]; then
          echo "No HTML report was generated — skipping S3 upload."
        else
          echo "Publishing HTML report to S3..."
          BUILD_TIMESTAMP=$(date -u +%Y-%m-%d-%H%M%S)
          aws s3 sync playwright-report/ "s3://$REPORT_BUCKET/latest/" --delete
          aws s3 sync playwright-report/ "s3://$REPORT_BUCKET/runs/$BUILD_TIMESTAMP/"
          # Prefer the URL CloudFormation derived from the bucket itself; the
          # hand-assembled fallback is only correct when the bucket is in the
          # same region as the build.
          REPORT_URL="${REPORT_WEBSITE_URL:-http://$REPORT_BUCKET.s3-website-$AWS_REGION.amazonaws.com}/latest/index.html"
          echo ""
          echo "============================================"
          echo "  PLAYWRIGHT REPORT URL"
          echo "  $REPORT_URL"
          echo "============================================"
          echo ""
        fi
      - |
        LINT_EXIT_CODE=$(cat "$STATUS_DIR/lint.exit" 2>/dev/null || echo 1)
        # Default to 1: a missing status file means the command never ran to
        # completion, which must not be reported as a pass.
        TEST_EXIT_CODE=$(cat "$STATUS_DIR/test.exit" 2>/dev/null || echo 1)
        echo "Summary: lint=$LINT_EXIT_CODE tests=$TEST_EXIT_CODE"
        if [ "$LINT_EXIT_CODE" -ne 0 ] || [ "$TEST_EXIT_CODE" -ne 0 ]; then
          echo "Build failed (lint=$LINT_EXIT_CODE, tests=$TEST_EXIT_CODE). Check the report for details."
          exit 1
        fi
        echo "All checks passed."

reports:
  playwright-results:
    # CodeBuild parses Cucumber JSON, JUnit, NUnit, NUnit3, TestNG and Visual
    # Studio TRX. The previous "GENERICJSONREPORT" pointed at Playwright's own
    # results.json, which is not a format CodeBuild can read.
    files:
      - "test-results/junit.xml"
    base-directory: "test-accelerator"
    file-format: "JUNITXML"

artifacts:
  files:
    - "test-accelerator/playwright-report/**/*"
    - "test-accelerator/test-results/**/*"
  base-directory: "."
  name: "test-results-$(date +%Y-%m-%d-%H%M%S)"
  discard-paths: no

cache:
  paths:
    - '/root/.npm/**/*'
    - '/root/.cache/ms-playwright/**/*'
