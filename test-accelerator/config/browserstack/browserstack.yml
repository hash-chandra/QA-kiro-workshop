userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

projectName: Test Automation Accelerator
buildName: ${BROWSERSTACK_BUILD_NAME}
# Appended to buildName so repeat runs on the same day stay distinguishable.
buildIdentifier: '#${BUILD_NUMBER}'

framework: playwright

platforms:
  - os: Windows
    osVersion: 11
    browserName: chrome
    browserVersion: latest
  - os: Windows
    osVersion: 11
    browserName: playwright-firefox
    browserVersion: latest
  - os: OS X
    osVersion: Sonoma
    browserName: playwright-webkit
    browserVersion: latest

parallelsPerPlatform: 3

browserstackLocal: true

debug: true
networkLogs: true
consoleLogs: info
